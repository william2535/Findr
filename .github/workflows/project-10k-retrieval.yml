name: Project 10K image retrieval
on:
  workflow_dispatch:
    inputs:
      prepare_import:
        description: 'Stage approved images with verified exact-code PDF matches'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-10k-retrieval.yml'
      - 'scripts/project-10k-retrieve.py'
      - 'scripts/project-10k-documents.py'
      - 'research/project-10k/paxton-source-review.json'
permissions:
  contents: read
concurrency:
  group: project-10k-retrieval
  cancel-in-progress: false
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install retrieval dependencies
        run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' 'Pillow>=11,<13' 'pypdf>=5,<7'
      - name: Retrieve first manufacturer batch
        run: |
          python -m py_compile scripts/project-10k-retrieve.py
          python scripts/project-10k-retrieve.py --discover --limit 100
      - name: Retrieve matching manufacturer documents
        run: |
          python -m py_compile scripts/project-10k-documents.py
          python scripts/project-10k-documents.py
      - name: Prepare and validate import
        if: inputs.prepare_import
        run: |
          python scripts/project-10k-prepare.py --approved research/project-10k/approved-images.json --verified-documents
          if python -c "import json; from pathlib import Path; import sys; sys.exit(0 if any(json.loads(p.read_text()) for p in Path('project-10k-batches').glob('*/devices.json')) else 1)"; then
            python scripts/add-device-images.py project-10k-batches --check
          else
            echo "::warning::No eligible image/document pairs; nothing imported. Inspect the staged audit."
            echo "### Import preparation: 0 eligible entries" >> "$GITHUB_STEP_SUMMARY"
            echo "No catalogue changes made. Review held candidates and exact document matches." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload staged import
        if: always() && inputs.prepare_import
        uses: actions/upload-artifact@v4
        with:
          name: project-10k-staged-import
          path: project-10k-batches/
      - name: Upload review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-10k-review
          path: project-10k-review/
          if-no-files-found: warn
          retention-days: 14
      - name: Check retrieval yield
        run: |
          python -c "import json; r=json.load(open('project-10k-review/report.json')); assert any(x['status']=='downloaded-awaiting-review' for x in r), 'No images retrieved; inspect review report'"
