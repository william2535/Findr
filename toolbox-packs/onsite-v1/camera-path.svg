<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"><rect width="800" height="500" rx="22" fill="#141414"/><style>text{font-family:Arial,sans-serif;fill:#f4f2e8;font-size:23px}.label{font-size:19px;fill:#c8c6b9}.big{font-size:38px;font-weight:bold;fill:#ffdd38}.line{fill:none;stroke:#ffdd38;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.box{fill:#242218;stroke:#a4923c;stroke-width:2}</style><text x="40" y="55" class="big">Follow the shared camera path</text><rect class="box" x="45" y="135" width="170" height="100" rx="12"/><rect class="box" x="315" y="135" width="170" height="100" rx="12"/><rect class="box" x="585" y="135" width="170" height="100" rx="12"/><path class="line" d="M215 185h100m170 0h100"/><text x="78" y="178">Camera</text><text x="64" y="211" class="label">power + link</text><text x="348" y="178">Switch</text><text x="338" y="211" class="label">PoE / ports</text><text x="605" y="178">Recorder</text><text x="610" y="211" class="label">live / storage</text><text x="225" y="267" class="label">copper</text><text x="492" y="267" class="label">uplink*</text><text x="60" y="335">One camera? Check its individual path.</text><text x="60" y="375">Several? Find the power / switch / uplink they share.</text><text x="60" y="420" class="label">*Copper or fibre where fitted. Diagram is not site topology.</text><text x="35" y="472" class="label">FINDR · original conceptual guide · check the equipment manual</text></svg>