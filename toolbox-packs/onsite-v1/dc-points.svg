<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"><rect width="800" height="500" rx="22" fill="#141414"/><style>text{font-family:Arial,sans-serif;fill:#f4f2e8;font-size:23px}.label{font-size:19px;fill:#c8c6b9}.big{font-size:38px;font-weight:bold;fill:#ffdd38}.line{fill:none;stroke:#ffdd38;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.box{fill:#242218;stroke:#a4923c;stroke-width:2}</style><text x="40" y="55" class="big">Record the actual voltage points</text><rect class="box" x="55" y="120" width="210" height="130" rx="12"/><rect class="box" x="535" y="120" width="210" height="130" rx="12"/><text x="105" y="170">DC supply</text><text x="585" y="170">Device</text><path class="line" d="M265 185h270M265 220h270"/><text x="245" y="178" class="label">+</text><text x="245" y="242" class="label">−</text><text x="110" y="293">Point A</text><text x="585" y="293">Point B</text><text x="70" y="340" class="label">Across supply + / −</text><text x="510" y="340" class="label">Across device + / −</text><text x="70" y="395">Also record: load state · connected / isolated</text><text x="70" y="425" class="label">A supply reading alone does not prove the voltage at the device.</text><text x="35" y="472" class="label">FINDR · original conceptual guide · check the equipment manual</text></svg>